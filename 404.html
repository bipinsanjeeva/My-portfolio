<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page Not Found | Bipin Sanjeeva</title>
    <meta name="description" content="This page doesn't exist. Head back to Bipin Sanjeeva's portfolio." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#000000" />
    <style>
        :root {
            --bg: #060608;
            --fg: #F5F5F5;
            --muted: #8A8A8A;
            --border: #18181b;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .wrap404 {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }
        .wrap404::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.06), transparent 60%);
            pointer-events: none;
        }
        .code {
            font-size: clamp(72px, 18vw, 160px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            margin: 0;
            background: linear-gradient(180deg, #fff, #7a7a7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .msg {
            font-size: clamp(15px, 2.2vw, 19px);
            color: var(--muted);
            max-width: 460px;
            margin: 14px 0 32px;
            line-height: 1.6;
        }
        .msg strong { color: var(--fg); font-weight: 600; }
        .btnRow {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn404 {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 26px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: border-color .2s ease, transform .2s ease, background .2s ease;
        }
        .btn404.primary {
            background: var(--fg);
            color: #0A0A0A;
            border-color: var(--fg);
        }
        .btn404.secondary {
            color: var(--fg);
            background: transparent;
        }
        .btn404:hover {
            transform: translateY(-2px);
            border-color: #4a4a4a;
        }
        .kicker404 {
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="wrap404">
        <div class="kicker404">Bipin Sanjeeva &middot; Email Copywriter</div>
        <h1 class="code">404</h1>
        <p class="msg">
            This page doesn't exist &mdash; or it moved. <strong>The copy you're looking for isn't here</strong>,
            but the rest of the work is.
        </p>
        <div class="btnRow">
            <a class="btn404 primary" href="./">Back to Home</a>
            <a class="btn404 secondary" href="./#projects">View Projects</a>
            <a class="btn404 secondary" href="./#contact">Get in Touch</a>
        </div>
    </div>
</body>
</html>
